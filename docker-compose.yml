# --------------------------------------------------------------------------- #
# Local dev stack: FastAPI + local Ollama inference on the host.
# --------------------------------------------------------------------------- #
# This is the way to run the FULL service offline: it launches the API in a
# container and mounts the host's Ollama as the inference backend (no API key,
# no cloud — the model already runs locally on the Geekom node).
#
# Use:  docker compose up --build
#
# IMPORTANT — do NOT set DOCKER_NONINTERACTIVE to hardcode the LLM endpoint.
# The model host differs per node; that stays an env var (LLM_BASE_URL at the
# host / container level), never baked into an image.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: extract-api:local
    ports:
      - "8100:8100"
    environment:
      # Point the API at the local Ollama /v1 exposed by the host.
      # Override LLM_BASE_URL to run the model inside the container instead.
      - LLM_BASE_URL=${LLM_BASE_URL:-ollama}
      - LLM_MODEL=${LLM_MODEL:-ornith-1.5:9b}
    extra_hosts:
      # Allow the container to reach a host's loopback-exposed Ollama that maps
      # 127.0.0.1 to the host (Tailscale / docker-proxy) on 11434.
      - "ollama:host-gateway"
    restart: unless-stopped

networks:
  default:
    name: extract-api
