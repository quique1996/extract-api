[project]
name = "extract-api"
version = "0.1.0"
description = "LLM-powered structured extraction service (FastAPI + Ollama)"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.11"]

[project.urls]
Homepage = "https://github.com/quique1996/extract-api"
